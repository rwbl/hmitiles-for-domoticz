<!DOCTYPE html>
<html lang="en">
<!--
Brief:  		Input field supporting text, number and color.
Data-Type:		input
Date:  		 	2026-07-25
Author:   		Robert W.B. Linn @ 2026 MIT
Description:	Input types supported by setting attribute data-input-type:
				Text: data-input-type="text"
				Number: data-input-type="number"
				Color:	data-input-type="color"
				Buttons: OK = data saved to device.Data, Cancel = No action.
Input Types:	To define more input types, amend the file hmitiles-processor.js.
				See in code under `case "input"`.
				If an input field gets its focus the mode changes to editing.
Color:			The color data is HEX value #RRGGBB. 
				This is also required as the input value.
				This means the device.Data (or any other property used) should contain 
				the HEX string.
				If the color field is clicked by the mousepointer the mode changes to editing.
				After that the browser color dialog is shown as popup.
				Selecting a color in the color popup immediate changes the value of 
				the input field, which then shows the selected color.
-->

<head>
    <meta charset="UTF-8">
    <title>HMITiles Input</title>

    <!-- Link backward to reuse shared global common styles -->
    <link rel="stylesheet" href="/templates/hmitiles/core/hmitiles.css">
	
	<!-- Link backward to the HMI tile engine -->
	<!-- Ensure type="module" is declared so the browser resolves the import statement -->
	<script type="module" src="/templates/hmitiles/core/hmitiles.js"></script>
</head>

<body>
	<header class="hmi-header-container">
		<div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
			<div style="display: flex; align-items: center; gap: 15px;">
				<button class="hmi-exit-btn" onclick="goToDomoticzDashboard()">&#9664; Main Menu</button>
				<h2>HMITiles Input</h2>
			</div>
			<div>
				<button class="hmi-exit-btn" onclick="goToHMITilesIndex()">HMITiles Index &#9654;</button>
			</div>
		</div>
	</header>

	<main class="hmi-panel">
	
		<!-- 
			INPUT
			Domoticz Type General / SubType Text
			Input text
		-->
		<div class="hmi-pack-tile" 
			data-type="input"
			data-device-idx="1"
			data-input-type="text"
			data-input-placeholder="Enter text...">
			<div class="hmi-tile-header">
				<div class="hmi-pack-label">Input (Text)</div>
				<div class="hmi-badge">SYNCED</div>
			</div>
			<div class="hmi-value-grid"></div>
		</div>
		
		<!-- 
			INPUT
			Domoticz Type General / SubType Text
			Input number
		-->
		<div class="hmi-pack-tile" 
			data-type="input"
			data-device-idx="13"
			data-input-type="number"
			data-input-placeholder="Enter number...">
			<div class="hmi-tile-header">
				<div class="hmi-pack-label">Input (Number)</div>
				<div class="hmi-badge">SYNCED</div>
			</div>
			<div class="hmi-value-grid"></div>
		</div>

		<!-- 
			INPUT
			Domoticz Type General / SubType Text
			Input color
		-->
		<div class="hmi-pack-tile" 
			data-type="input"
			data-device-idx="74"
			data-input-type="color"
			data-input-placeholder="Enter color...">
			<div class="hmi-tile-header">
				<div class="hmi-pack-label">Input (Color)</div>
				<div class="hmi-badge">SYNCED</div>
			</div>
			<div class="hmi-value-grid"></div>
		</div>


	</main>

</body>
</html>
